<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>Elev/Esc Status</h1>
    <button class="gear-btn" id="gearButton" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFF"><path d="M223.5-423.5Q200-447 200-480t23.5-56.5Q247-560 280-560t56.5 23.5Q360-513 360-480t-23.5 56.5Q313-400 280-400t-56.5-23.5ZM280-240q-100 0-170-70T40-480q0-100 70-170t170-70q67 0 121.5 33t86.5 87h352l120 120-180 180-80-60-80 60-85-60h-47q-32 54-86.5 87T280-240Zm0-80q56 0 98.5-34t56.5-86h125l58 41 82-61 71 55 75-75-40-40H435q-14-52-56.5-86T280-640q-66 0-113 47t-47 113q0 66 47 113t113 47Z"/></svg>

  <div class="settings-panel" id="settingsPanel">
    <label for="userText">API key:</label>
    <input type="text" id="userText" placeholder="Type here..." />
  </div>

  <main class="container">
    <section class="card">
      <!-- div class="toolbar">
        <button id="refreshBtn">Refresh Data</button>
        <span id="status"></span>
      </div -->

      <div id="jumpLinksElev" style="display: flex; align-items: center; gap: 8px;"></div>
      <div id="jumpLinksEsc" style="display: flex; align-items: center; gap: 8px;"></div>

      <table id="dataTableElev">
        <thead>
          <tr>
            <th>Reported</th>
            <th>Updated</th>
            <th>Estimated Return</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows inserted by JS -->
        </tbody>
      </table>

      <hr>

      <table id="dataTableEsc">
        <thead>
          <tr>
            <th>Reported</th>
            <th>Updated</th>
            <th>Estimated Return</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows inserted by JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
